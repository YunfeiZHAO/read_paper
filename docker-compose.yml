services:
  app:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      QA_DATA_DIR: /app/instance
    expose:
      - "8080"
    volumes:
      - app-data:/app/instance
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/workspaces', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  app-data:

networks:
  dokploy-network:
    external: true
    name: dokploy-network
