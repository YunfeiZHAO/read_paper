services:
  app:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      QA_DATA_DIR: /app/instance
      # All other configuration comes from .env file:
      #   - AUTH_USERS (multiple users)
      #   - AUTH_SECRET_KEY (JWT signing key)
      #   - AUTH_SESSION_TIMEOUT_SECONDS (session duration)
      #   - ANTHROPIC_API_KEY or ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN
      #   - ENABLE_WEB_SEARCH, PORT, HOST, etc.
      #
      # See .env.example for all available options
    expose:
      - "8080"
    volumes:
      - app-data:/app/instance
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/auth/status', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  app-data:

networks:
  dokploy-network:
    external: true
    name: dokploy-network
