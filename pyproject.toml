[project]
name = "tree-qa"
version = "0.1.0"
description = "FastAPI web app for reading PDFs and asking tree-structured questions about them, with a choice of Codex CLI or Claude API backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "anthropic",
    "python-dotenv",
]

# Needed only by the Codex backend; not required for Claude-only use.
# Enable with: uv sync --extra codex
[project.optional-dependencies]
codex = ["sub-pool-client"]

# Desktop app: run the local server inside a native window (pywebview) and freeze it into a
# standalone .app/.exe/binary with PyInstaller. Enable with: uv sync --extra desktop
desktop = ["pywebview>=5", "pyinstaller>=6"]

# Packages the bash tool (Codex/Claude running commands to read papers) may use; the app
# itself never imports them. Pre-install so the bash tool works without on-the-fly installs:
# uv sync --extra tools
tools = [
    "PyMuPDF",      # import fitz — PDF text/image extraction
    "pdfplumber",   # PDF table/text extraction
    "pypdf",        # PDF split/merge/page operations
    "Pillow",       # image processing (screenshots, conversion, cropping figures)
    "requests",     # downloading papers
    "beautifulsoup4",  # HTML parsing
    "lxml",         # BeautifulSoup / web-parsing backend
]

[dependency-groups]
# Dev/test deps: install with `uv sync --group dev`, run with `uv run pytest`.
# httpx is a dependency of the FastAPI/Starlette TestClient.
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
# This is an application, not a library: don't build/install it as a package; uv only
# manages the environment and dependencies.
package = false
